name: TestFlight

on:
  # Tag a release and the build lands on TestFlight unattended.
  push:
    tags:
      - "v*"
  # Manual runs stay available for re-uploading a build number or testing a branch.
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override (default: the workflow run number)"
        required: false
        type: string

# Never let two uploads race: App Store Connect rejects duplicate build numbers,
# and a cancelled upload can leave a half-processed build behind.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # Pinned rather than following the runner default, so a release build does not
  # change toolchain underneath us when GitHub rolls the image default forward.
  # macos-26 currently ships 26.0.1 / 26.1.1 / 26.2 / 26.3 / 26.4.1 / 26.5 / 26.6
  # with 26.5 as the default. Bump deliberately, not by drift.
  XCODE_VERSION: "26.6"

jobs:
  deploy:
    name: Build and upload to TestFlight
    # Standard macOS runners are free on public repositories.
    # Do NOT switch to macos-26-large/-xlarge: large runners are billed even here.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -n "$XCODE_VERSION" ]; then
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
            # Runner images drop old Xcodes over time. Say what is actually
            # there rather than failing on an opaque xcode-select error.
            if [ ! -d "$XCODE_APP" ]; then
              echo "Xcode $XCODE_VERSION is not on this runner. Installed:" >&2
              ls -d /Applications/Xcode*.app >&2
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Resolve version and build number
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

          # A release tag is the source of truth for the marketing version, so a
          # tag can never disagree with what ships. Manual runs carry no tag and
          # keep whatever MARKETING_VERSION the project declares.
          MARKETING_VERSION=""
          if [ "$REF_TYPE" = "tag" ]; then
            MARKETING_VERSION="${REF_NAME#v}"
            # CFBundleShortVersionString must be one to three dot-separated
            # integers. Reject anything else here rather than letting Apple
            # bounce the upload minutes later.
            if ! printf '%s' "$MARKETING_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "Tag '$REF_NAME' is not a release version." >&2
              echo "Expected vMAJOR[.MINOR[.PATCH]], e.g. v1.2 or v1.2.3." >&2
              exit 1
            fi
          fi
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: ${MARKETING_VERSION:-(from project)}"
          echo "Build:   $BUILD_NUMBER"

      # The distribution certificate must be supplied, not auto-created:
      # -allowProvisioningUpdates would mint a NEW certificate on every run
      # (the runner keychain is ephemeral) and Apple caps distribution
      # certificates at 3. Profiles are still managed automatically.
      - name: Import distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          # Generated per-run, never persisted: no secret needed for this.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list so the toolchain still works.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Written to the location altool discovers by convention, so both
      # xcodebuild (explicit path) and altool (auto-discovery) can use it.
      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      # Manual signing: the profiles are supplied, not fetched. Nothing in the
      # build talks to the provisioning API.
      - name: Install provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_EXTENSION_BASE64: ${{ secrets.PROFILE_EXTENSION_BASE64 }}
        run: |
          set -euo pipefail
          # Xcode 16+ reads the UserData path; older tooling reads the legacy
          # one. Install into both rather than depending on which wins.
          LEGACY="$HOME/Library/MobileDevice/Provisioning Profiles"
          MODERN="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          TMP="$RUNNER_TEMP/profiles"
          mkdir -p "$LEGACY" "$MODERN" "$TMP"

          echo "$PROFILE_APP_BASE64" | base64 --decode > "$TMP/app.mobileprovision"
          echo "$PROFILE_EXTENSION_BASE64" | base64 --decode > "$TMP/ext.mobileprovision"

          for p in "$TMP"/*.mobileprovision; do
            PLIST="$(security cms -D -i "$p")"
            UUID="$(echo "$PLIST" | plutil -extract UUID raw -)"
            NAME="$(echo "$PLIST" | plutil -extract Name raw -)"
            cp "$p" "$LEGACY/$UUID.mobileprovision"
            cp "$p" "$MODERN/$UUID.mobileprovision"
            # The name must match PROVISIONING_PROFILE_SPECIFIER exactly, and
            # the profile must carry the App Group. A profile minted before the
            # capability was enabled lacks the entitlement; archive would catch
            # it, but four minutes later and behind a wall of signing errors.
            # Failing here names the offending profile and the fix directly.
            printf "installed %-32s uuid=%s\n" "'$NAME'" "$UUID"
            if echo "$PLIST" | grep -q "group.com.max.PeakForm"; then
              echo "    app group: present"
            else
              echo "    app group: MISSING in '$NAME'" >&2
              echo "    enable App Groups on this profile's App ID, then regenerate it" >&2
              exit 1
            fi
          done
          rm -rf "$TMP"

      # No -allowProvisioningUpdates and no API key: signing settings live in
      # the Release configs and the profiles are already on disk.
      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          set -euo pipefail
          # Only override MARKETING_VERSION when a tag supplied one; passing an
          # empty value would blank CFBundleShortVersionString.
          OVERRIDES=(CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          if [ -n "$MARKETING_VERSION" ]; then
            OVERRIDES+=(MARKETING_VERSION="$MARKETING_VERSION")
          fi
          xcodebuild archive \
            -project PeakLog.xcodeproj \
            -scheme PeakLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PeakLog.xcarchive" \
            "${OVERRIDES[@]}"

      - name: Export .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PeakLog.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          if [ -z "$IPA" ]; then
            echo "No .ipa produced by exportArchive" >&2
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      # dSYMs are the only way to symbolicate TestFlight crashes later, and the
      # archive is gone once the runner is torn down.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peaklog-build-${{ steps.version.outputs.build_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/PeakLog.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          {
            echo "### Uploaded to TestFlight"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.marketing_version || 'from project' }}\`"
            echo "- Build number: \`${{ steps.version.outputs.build_number }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "App Store Connect processing usually takes 5-30 minutes."
            echo "The build then auto-distributes to the internal testing group."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up secrets from runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
